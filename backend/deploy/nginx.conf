# Kendi alan adı ve mevcut TLS sertifikalarının yollarıyla değiştir.
# Nginx aynı hostta, uygulama yalnızca 127.0.0.1:4400 üzerinde çalışır.
server {
    listen 80;
    server_name yonetim.senin-alanin.tld;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name yonetim.senin-alanin.tld;
    ssl_certificate /etc/letsencrypt/live/yonetim.senin-alanin.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yonetim.senin-alanin.tld/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
